    <text x="176" y="62" text-anchor="middle" fill="#102737" font-size="12" font-weight="700" letter-spacing="2">YOUR ENGINEERING TOOLKIT</text>
    <text x="56" y="147" fill="#f4f8fc" font-size="62" font-weight="750" letter-spacing="-2">Agentic Pro Skills</text>
    <text x="59" y="193" fill="#c1d2e3" font-size="24">Better workflows. Clearer evidence.</text>
    <text x="59" y="231" fill="#c1d2e3" font-size="19">For Claude Code &amp; Codex</text>
    <g font-size="14" font-weight="700" text-anchor="middle">
