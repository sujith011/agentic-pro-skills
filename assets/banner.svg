<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Pro Skills</title>
  <desc id="desc">Engineering workflows for Claude Code and Codex. Define, plan, build, verify, review, ship.</desc>
  <defs>
