      <rect x="422" y="282" width="112" height="42" rx="12" fill="#64e4bc"/><text x="478" y="308" fill="#102737">VERIFY</text>
      <rect x="544" y="282" width="112" height="42" rx="12" fill="#ffd17d"/><text x="600" y="308" fill="#102737">REVIEW</text>
      <rect x="666" y="282" width="112" height="42" rx="12" fill="#ff9c98"/><text x="722" y="308" fill="#102737">SHIP</text>
